<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bex · Curadoria &amp; Elegibilidade DVOP</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app" class="v2-layout">
  <!-- FAIXA SLIM DO TOPO: marca à esquerda, usuário/sair à direita (sem busca) -->
  <header class="bex-header-slim">
    <div class="v2-brand">
      <div class="v2-logo-icon">B</div>
      <div class="v2-brand-text-wrap">
        <span class="v2-brand-title">Bex</span>
        <span class="v2-brand-sub">Curadoria &amp; Elegibilidade DVOP</span>
      </div>
    </div>
    <!-- o app.js injeta aqui o chip de usuário (nome + sair) após autenticar -->
    <div id="topbar-user"></div>
  </header>

  <div class="v2-container">
    <!-- ABAS HORIZONTAIS DO MÓDULO — o router marca .ativo via data-rota -->
    <div id="menu">
      <nav class="curadoria-module-tabs">
        <a href="#/" data-rota="inicio" class="curadoria-tab">
          <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
          <span class="tab-label">Visão Geral</span>
        </a>
        <a href="#/fila" data-rota="fila" class="curadoria-tab">
          <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span>
          <span class="tab-label">Fila</span>
          <span class="tab-badge pill-fila" id="cont-fila">–</span>
        </a>
        <a href="#/cache" data-rota="cache" class="curadoria-tab">
          <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span>
          <span class="tab-label">Cache</span>
          <span class="tab-badge pill-cache" id="cont-cache">–</span>
        </a>
        <a href="#/base" data-rota="base" class="curadoria-tab">
          <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
          <span class="tab-label">Base RAG</span>
          <span class="tab-badge" id="cont-base">–</span>
        </a>
        <a href="#/modelos" data-rota="modelos" class="curadoria-tab">
          <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><line x1="6" y1="9" x2="6" y2="21"/></svg></span>
          <span class="tab-label">Modelos de PR</span>
          <span class="tab-badge" id="cont-modelos">–</span>
        </a>
        <a href="#/credencial" data-rota="credencial" class="curadoria-tab">
          <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
          <span class="tab-label">Credencial</span>
          <span class="tab-badge status-ok" id="cont-credencial">–</span>
        </a>
      </nav>
    </div>

    <div id="aviso" role="alert"></div>
    <div id="view"></div>
  </div>
</div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
